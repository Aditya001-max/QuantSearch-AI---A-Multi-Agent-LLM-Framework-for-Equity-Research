[project]
name = "alphaagent"
version = "1.0.0"
description = "CrewAI Multi-Agent Autonomous Equity Research & Consensus Trading System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aditya001-max", email = "kaushikadityaraj001@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "crewai>=0.177.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
